# リポジトリのクローンができない実行環境向けの単体定義。
# (NAS のコンテナマネージャー等、管理画面に YAML を貼り付けて起動するタイプの環境を想定)
#
# docker-compose.yml との違いは2点だけ:
#   1. `${...}` を使わず、値を YAML に直接書く(シェルの環境変数も `.env` も無い前提)
#   2. `docker-compose.build.yml` を重ねられない(ソースが手元に無いので GHCR から pull するだけ)
#
# これは雛形。実値を入れたものは .gitignore してあるので、手元でコピーして作る:
#
#   cp docker-compose.standalone.example.yml docker-compose.standalone.yml
#
# 使い方:
#   1. コピーした側の**先頭の「ここだけ編集」を書き換える**
#      (必須はデータの置き場のホスト絶対パスだけ)
#   2. その内容をそのまま管理画面に貼り付ける
#   3. 起動して http://<ホスト>:7020/ を開く
#
# 非公開リポジトリのため GHCR のパッケージも非公開。pull する前に、そのホストで
# `read:packages` スコープの Personal Access Token を使って
# `docker login ghcr.io -u <GitHub ユーザー名>` を済ませておくこと。
#
# 通常の(リポジトリを配置できる)環境では docker-compose.yml を使う
# —— こちらは値の直書きぶん古くなりやすい。**docker-compose.yml を変えたらこの雛形も追従させること。**
name: tech-antenna

# ---- DB のパスワード ----
# 変えるなら**初回起動の前に、2行とも同じ値にすること**(YAML のアンカーは文字列の一部に
# 差し込めないため2行に分けてある)。**片方だけ直すと静かに壊れる** —— app は DB に繋がらないと
# 接続文字列が無いときと同じ扱いになり、メモリ上のストアで起動して再起動のたびにデータが消える。
# データの置き場を作った後で変えても DB 側は変わらないまま接続文字列だけがずれる
x-postgres-password: &postgres-password "techantenna"
x-connection-string: &connection-string "Host=db;Port=7021;Database=techantenna;Username=techantenna;Password=techantenna"

# ---- ここだけ編集: イメージ ----
# :latest ではなく :sha-xxxxxxx を指定すれば特定のイメージを指せる。
# ※ GHCR には**最新の 1 版しか残らない**（push のたびに古い版を消してストレージの
#   無料枠を守っている。.github/workflows/build-and-push-image.yml）ので、
#   過去のイメージへは戻せない。戻せるようにするなら、あちらの
#   min-versions-to-keep を上げて残す世代を増やすこと。
x-image: &image "ghcr.io/rtcode337/tech-antenna:latest"

# ---- ここだけ編集: データの置き場(そのホストの絶対パス) ----
# 名前付きボリュームではなくホストのディレクトリに置く(data ごとコピーすればバックアップ
# になる)。無ければ Docker が作るが、先に作っておくのが確実。
# postgres 側は中身の所有者をエントリポイントが揃えるので、ホスト側の準備は要らない
x-postgres-dir: &postgres-dir "/path/to/tech-antenna/data/postgres"
x-keys-dir: &keys-dir "/path/to/tech-antenna/data/keys"
# CLI ブリッジと共有する設定の置き場(app が書き、bridge が読み取り専用で読む)
x-state-dir: &state-dir "/path/to/tech-antenna/data/state"

# ---- ここだけ編集: 公開ポート ----
# host:container。コンテナ内は 7020 固定なので、変えるのは左だけ。
# 6000 番台はブラウザが X11 用の予約ポートとして拒否する(ERR_UNSAFE_PORT)ので使わない
x-port: &port "7020:7020"

# ---- ここだけ編集: タイムゾーン ----
x-timezone: &timezone "Asia/Tokyo"

# ---- ここだけ編集: アプリの設定(.env の代わり) ----
x-app-env: &app-env
  ConnectionStrings__Default: *connection-string
  TZ: *timezone

  # 定期実行のオン/オフは画面(設定)から切り替える(既定はすべて無効)

  # **外部 API のキーはここでは渡せない**(画面の「設定 → 外部連携」から入れる。
  # 暗号化して DB に保存され、再起動なしで効く)。渡すのはキー以外の設定だけ

  # Claude Code の CLI は bridge サービスが持つ(このイメージには入っていない)。
  # ホストへは公開していないので、サービス名で内部ネットワーク越しに呼ぶ
  ClaudeCode__BridgeUrl: "http://bridge:7013/v1"

  # ---- ここだけ編集(任意): Chiezo(LAN 内の知識サーバー)の URL ----
  # 入れると LLM の相手を画面から選べる(設定 → AI)。鍵は Chiezo が持っている。
  # 空なら従来どおり bridge / Anthropic API を使う
  Chiezo__BaseUrl: ""

  # 今日のサマリーの ntfy 通知。接続先(URL・トピック・トークン)は画面から設定する。
  # タップで開く URL だけは「この環境の公開 URL」というデプロイ側の事実なのでここに残す
  Ntfy__ClickUrl: ""

  # リバースプロキシ配下で X-Forwarded-* を信頼するときだけ true にする
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "false"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: techantenna
      POSTGRES_PASSWORD: *postgres-password
      POSTGRES_DB: techantenna
      TZ: *timezone
      # 既定の 5432 ではなく 7020 番台に寄せる(接続文字列の Port= と同じ値にすること)。
      # PGPORT はサーバーもクライアントも読むので healthcheck に -p は要らない
      PGPORT: 7021
    volumes:
      # postgres:18 のイメージは PGDATA が /var/lib/postgresql/18/docker で、
      # マウントするのはその1段上の /var/lib/postgresql(17 以前とは位置が違う)
      - type: bind
        source: *postgres-dir
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techantenna -d techantenna"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 鍵と共有設定の置き場を app の実行ユーザー(イメージが持つ非 root、UID 1654)が
  # 書けるようにする。ホストのディレクトリは作成者の所有になるため、そのままでは書き出せない
  # chown を実行するだけなので、アプリのイメージではなく小さい汎用イメージを使う
  init:
    image: alpine:3.24
    user: root
    entrypoint: ["sh", "-c", "chown -R 1654:1654 /app/keys /app/state"]
    volumes:
      - type: bind
        source: *keys-dir
        target: /app/keys
      - type: bind
        source: *state-dir
        target: /app/state
    restart: "no"

  app:
    image: *image
    depends_on:
      # 起動時にマイグレーションを当てるため、DB が受け付けられるまで待つ
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment: *app-env
    ports:
      - *port
    volumes:
      # antiforgery と Blazor が使う Data Protection の鍵。コンテナを作り直しても
      # 鍵を引き継げるようにする(消えると開いていたページの操作が一度エラーになる)
      - type: bind
        source: *keys-dir
        target: /app/keys
      # CLI ブリッジと共有する設定。画面で入れた Claude Code のトークンをここへ書き、
      # ブリッジが読む(アプリの環境変数では渡せない —— CLI は別コンテナで動くため)
      - type: bind
        source: *state-dir
        target: /app/state
    restart: unless-stopped

  # Claude Code の CLI を OpenAI 互換の口に見せるサイドカー(chiezo リポジトリのイメージ)。
  # **アプリ本体は CLI を持たない**。**ホストへポートを公開しない** ——
  # 認証が無くトークンも読めるので、外から触れるとそのまま AI を使われる。
  # **公開パッケージ**なので、このイメージだけは docker login 無しで pull できる
  bridge:
    image: "ghcr.io/rtcode337/chiezo-bridge:latest"
    volumes:
      # **読み取り専用**。ブリッジは書かない
      - type: bind
        source: *state-dir
        target: /state
        read_only: true
    environment:
      - CHIEZO_BRIDGE_CLI=claude
      # MCP は繋がない(渡すのは自前のプロンプトで、知識ベースを引かせる用途ではない)
      - CHIEZO_BRIDGE_MCP_URL=
      - CHIEZO_BRIDGE_TIMEOUT=300
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:7013/health"]
      interval: 60s
