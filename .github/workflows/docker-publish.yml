# main への push で本番用イメージをビルドし GHCR へ公開する。
# 本番の更新は docker compose pull && docker compose up -d だけでよい(README「本番運用」参照)。
#
#   ghcr.io/rtcode337/tech-antenna
#
# amd64 / arm64 を1つのマニフェストにまとめて push する。dotnet publish は Dockerfile 側で
# -a によるクロスコンパイルにしてあり、実行ステージにも RUN が無いため、arm64 向けでも
# QEMU エミュレーションは要らない(setup-qemu-action を入れていないのはこのため)。
name: docker-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # テストが落ちたコードのイメージが :latest になるのを防ぐため、publish の前に通す。
  # イメージのビルド(SDK コンテナ)とは別に、ランナー上の SDK で dotnet test を回す
  # (本番イメージにテストプロジェクトを含めないため)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - run: dotnet test --nologo

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest(既定ブランチのみ)+ コミット SHA(sha-xxxxxxx)の2タグ。
          # 障害時は SHA タグを指定して pull すれば任意の時点へ戻せる
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
