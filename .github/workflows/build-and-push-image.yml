# Docker イメージをビルドして GHCR(ghcr.io)へ公開するワークフロー。
#
# デプロイ先は `docker compose pull` でこのイメージを取得して動かす前提。
# ビルドするのは linux/amd64 のみ(非公開リポジトリでは Actions の実行時間も GHCR の
# ストレージもプランの無料枠を消費する。arm64 のネイティブランナーは公開リポジトリで
# ないと無料枠で使えず、QEMU エミュレーション下の dotnet publish は極端に遅いため
# ここでは作らない。arm64 が要るときは Dockerfile がクロスコンパイルに対応しているので、
# 手元で `docker buildx build --platform linux/arm64` すればよい)。
name: build-and-push-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # ドキュメントだけの変更ではイメージの中身が変わらないため、実行時間を使わない
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docker-compose*.yml"
      - ".env.example"
  # 手動実行(Actions タブの "Run workflow")
  workflow_dispatch:

# 同じ ref への連続 push では古い実行を打ち切る(無料枠の節約)
concurrency:
  group: build-and-push-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # GHCR への push に必要

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Buildx をセットアップ
        uses: docker/setup-buildx-action@v4

      - name: GHCR にログイン
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグ:
      #   latest        … main への push 時(デプロイ先が通常追いかけるタグ)
      #   sha-<短縮SHA> … 毎回付ける固定タグ(どのコミットが動いているか後から特定できる)
      #   v1.2.3        … `v*` タグを push した場合のみ
      - name: イメージのタグ・ラベルを決める
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: イメージをビルドして push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # 単一アーキテクチャなので attestation(provenance/sbom)は付けない
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # レイヤーキャッシュを実行間で使い回す。csproj を触っていない push では
          # NuGet の復元層ごと再利用される
          cache-from: type=gha
          cache-to: type=gha,mode=max
