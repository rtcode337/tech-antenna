# イメージをその場でビルドして動かす用。docker-compose.yml に重ねて使う上書き定義で、
# 単体では動かない:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 通常は GHCR の公開イメージを pull すればよく(docker-compose.yml)、こちらを使うのは
# 手元の変更を本番同等で確かめたいときと、GHCR を使わずに動かしたいとき。
# pull した版と区別できるよう、タグは :local にする。
services:
  app:
    build:
      context: .
    image: ghcr.io/rtcode337/tech-antenna:local
