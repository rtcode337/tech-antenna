# 本番用。この定義自体はイメージをビルドせず、GHCR に置いたイメージを pull して動かす:
#
#   docker compose pull && docker compose up -d
#
# イメージは main への push で GitHub Actions がビルドして GHCR へ公開する。
# デプロイ先でその場からビルドしたいときは docker-compose.build.yml を重ねる:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 特定のイメージを指定したいときは TECH_ANTENNA_IMAGE(:sha-xxxxxxx 等)を使う。
# 設定値は .env(.env.example をコピーして作る)から渡す。
# リポジトリを置けない環境向けには docker-compose.standalone.yml を用意している。
name: tech-antenna

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techantenna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-techantenna}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      # postgres:18 のイメージは PGDATA が /var/lib/postgresql/18/docker で、
      # ボリュームの単位はその1段上の /var/lib/postgresql(17 以前とは位置が違う)。
      # bind マウントではなく名前付きボリュームにして、ホスト側の所有者調整を不要にしている
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techantenna} -d ${POSTGRES_DB:-techantenna}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ${TECH_ANTENNA_IMAGE:-ghcr.io/rtcode337/tech-antenna:latest}
    depends_on:
      # 起動時にマイグレーションを当てるため、DB が受け付けられるまで待つ
      db:
        condition: service_healthy
    environment:
      # 未設定だとメモリ上のストアで動いてしまい再起動でデータが消えるため、必ず渡す
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-techantenna};Username=${POSTGRES_USER:-techantenna};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      TZ: ${TZ:-Asia/Tokyo}
      # 収集・要約の定期実行。**既定は false(画面のボタンを押したときだけ動く)** で、
      # 定期実行に切り替えるときだけ .env で true にする
      Collection__AutoRun: ${COLLECTION_AUTORUN:-false}
      Books__AutoRun: ${BOOKS_AUTORUN:-false}
      Anthropic__AutoRun: ${SUMMARY_AUTORUN:-false}
      # 外部 API のキー。未設定ならその収集ジョブが動かないだけで起動はする
      Connpass__ApiKey: ${CONNPASS_API_KEY:-}
      Doorkeeper__AccessToken: ${DOORKEEPER_ACCESS_TOKEN:-}
      Books__GoogleBooksApiKey: ${GOOGLE_BOOKS_API_KEY:-}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      # 既定は appsettings.json と同じ。コストを抑えるなら claude-haiku-4-5 を指定する
      Anthropic__Model: ${ANTHROPIC_MODEL:-claude-opus-5}
      # Claude Code のヘッドレス実行で要約する場合のトークン(`claude setup-token` で発行)。
      # 設定されていると API キーより優先され、従量課金ではなくサブスクリプションの枠を使う。
      # 変数名は claude CLI が直接読むもので、アプリは有無を見て方式を選ぶだけ
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ClaudeCode__Model: ${CLAUDE_CODE_MODEL:-}
      # リバースプロキシ配下で X-Forwarded-* を信頼するときだけ true にする
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: ${FORWARDED_HEADERS_ENABLED:-false}
    ports:
      # host:container。コンテナ内は 8080 固定(Dockerfile の EXPOSE と同じ)で、
      # ホスト側は 10000(開発の dotnet run と同じ番号。同時起動はできない)
      - "${PORT:-10000}:8080"
    volumes:
      # antiforgery と Blazor が使う Data Protection の鍵。コンテナを作り直しても
      # 鍵を引き継げるようにする(消えると開いていたページの操作が一度エラーになる)
      - dpkeys:/app/keys
    restart: unless-stopped

volumes:
  pgdata:
  dpkeys:
